<g transform="translate(530,616)"><rect width="50" height="50" rx="16" fill="#e7f2ff"/><g transform="translate(9,9)" fill="none" stroke="#0086ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="14"/><path d="M12 11a4.2 4.2 0 1 1 7 3c-3 2-3 3-3 6M16 25h.01"/></g></g>
<text x="602" y="641" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#091947" text-anchor="start" dominant-baseline="middle">Mutabakat kararınız nedir?</text>
<text x="385" y="614" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#455b7b" text-anchor="middle" dominant-baseline="middle">Bekletin</text>
<text x="1155" y="614" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#455b7b" text-anchor="middle" dominant-baseline="middle">Reddedin</text>
<text x="810" y="716" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Onaylayın</text>
<rect x="70" y="757" width="360" height="166" rx="22" fill="url(#warm)" stroke="#ffa17c" stroke-width="1" filter="url(#shadow)"/>
<g transform="translate(90,777)"><rect width="50" height="50" rx="16" fill="#fff0e7"/><g transform="translate(9,9)" fill="none" stroke="#eb5d21" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5v22M23 5v22"/></g></g>
<text x="160" y="802" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#cb440c" text-anchor="start" dominant-baseline="middle">Bekletin</text>
<path d="M94 842 V897" stroke="#ffa17c" stroke-width="2"/>
<text x="109" y="854" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#cb440c" text-anchor="start" dominant-baseline="middle">TM incelemesinde kalır.</text>
<text x="109" y="885" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#cb440c" text-anchor="start" dominant-baseline="middle">Yeniden değerlendirebilirsiniz.</text>
<rect x="508" y="757" width="520" height="166" rx="22" fill="url(#card)" stroke="#8dbaff" stroke-width="1" filter="url(#shadow)"/>
<g transform="translate(530,777)"><rect width="50" height="50" rx="16" fill="#e7f2ff"/><g transform="translate(9,9)" fill="none" stroke="#0086ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l8 8L29 6"/></g></g>
<text x="602" y="802" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" fill="#408a13" text-anchor="start" dominant-baseline="middle">Onaylayın</text>
<path d="M534 842 V897" stroke="#8dbaff" stroke-width="2"/>
<text x="549" y="854" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Mutabakat onaylanır.</text>
<text x="549" y="885" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Nihai kararınızı değiştiremezsiniz.</text>
<rect x="1106" y="757" width="360" height="166" rx="22" fill="url(#warm)" stroke="#ffa17c" stroke-width="1" filter="url(#shadow)"/>
<g transform="translate(1126,777)"><rect width="50" height="50" rx="16" fill="#fff0e7"/><g transform="translate(9,9)" fill="none" stroke="#eb5d21" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l20 20M26 6 6 26"/></g></g>
<text x="1196" y="802" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#cb440c" text-anchor="start" dominant-baseline="middle">Reddedin</text>
<path d="M1130 842 V897" stroke="#ffa17c" stroke-width="2"/>
<text x="1145" y="854" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#cb440c" text-anchor="start" dominant-baseline="middle">Mutabakat reddedilir.</text>
<text x="1145" y="885" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#cb440c" text-anchor="start" dominant-baseline="middle">Nihai kararınızı değiştiremezsiniz.</text>
<rect x="428" y="1070" width="680" height="140" rx="22" fill="url(#card)" stroke="#8dbaff" stroke-width="1" filter="url(#shadow)"/>
<g transform="translate(451,1090)"><rect width="50" height="50" rx="16" fill="#e7f2ff"/><g transform="translate(9,9)" fill="none" stroke="#0086ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 26l9-11 7 6L30 5"/></g></g>
<text x="523" y="1115" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#091947" text-anchor="start" dominant-baseline="middle">Mutabakat sonucunu takip edin</text>
<path d="M453 1152 V1176" stroke="#8dbaff" stroke-width="2"/>
<text x="468" y="1164" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Onay veya ret kararınızla süreç sonuçlanır.</text>
