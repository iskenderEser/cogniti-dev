<text x="523" y="220" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#091947" text-anchor="start" dominant-baseline="middle">Dönemi ve durum filtresini seçin</text>
<path d="M453 257 V312" stroke="#8dbaff" stroke-width="2"/>
<text x="468" y="269" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Sayfa önceki ayla açılır.</text>
<text x="468" y="300" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Karar vereceğiniz kayıtlar için Karar bekliyor’u seçin.</text>
<rect x="428" y="371" width="680" height="164" rx="22" fill="url(#card)" stroke="#8dbaff" stroke-width="1" filter="url(#shadow)"/>
<g transform="translate(451,391)"><rect width="50" height="50" rx="16" fill="#e7f2ff"/><g transform="translate(9,9)" fill="none" stroke="#0086ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6C11 2 5 2 2 4v23c5-3 10-3 14 0 4-3 9-3 14 0V4c-3-2-9-2-14 2v21"/></g></g>
<text x="523" y="416" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#091947" text-anchor="start" dominant-baseline="middle">BM, UTT ve eczane işlemlerini inceleyin</text>
<path d="M453 453 V508" stroke="#8dbaff" stroke-width="2"/>
<text x="468" y="465" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Ürün, yayın, kullanılan puan ve indirim tutarını kontrol edin.</text>
<text x="468" y="496" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">İsterseniz Düz Tablo’dan işlemleri birlikte görebilirsiniz.</text>
