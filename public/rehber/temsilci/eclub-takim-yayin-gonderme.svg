<text x="65" y="1549" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">* Seçtiğin yayın ve üyeler, gönderim hakları ve tarih bakımından kontrol edilir.</text>
