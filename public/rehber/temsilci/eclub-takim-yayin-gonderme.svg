<text x="65" y="1619" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Onaylı listede bulunmayan eczaneler için önce onay iste.</text>
<text x="65" y="1654" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Yeni üyeler, giriş için üyelik davetini kabul eder.</text>
