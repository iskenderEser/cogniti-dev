<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1620" viewBox="0 0 1800 1620" role="img" aria-labelledby="title desc">
<title id="title">Yayına Açma Yol Haritası</title>
<desc id="desc">Üretici roller için yayına hazır içerik seçimi, hedef kitleye göre puan ve kazanım ayarları, hemen veya ileri tarihli yayımlama ve yayın onayı akışı.</desc>
