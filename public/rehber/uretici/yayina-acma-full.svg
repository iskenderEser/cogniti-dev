<text x="91" y="646" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Yayın sıklığını belirleyin.</text>
<text x="91" y="678" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">İleri sarma iznini tercih edin.</text>
<text x="91" y="724" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#091947" text-anchor="start" dominant-baseline="middle">Puanlama modelini seçin:</text>
<text x="91" y="762" font-family="Arial, sans-serif" font-size="23" fill="#455b7b"><tspan font-weight="600" fill="#091947">Çekli karşılıklı puan:</tspan><tspan> Öğrenirken kazandırır</tspan></text>
<text x="91" y="797" font-family="Arial, sans-serif" font-size="23" fill="#455b7b"><tspan font-weight="600" fill="#091947">Çeksiz puan:</tspan><tspan> Öğrenmenin gücü</tspan></text>
</g>
