<text x="681" y="599" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Doğru cevap puanını seçin.</text>
<text x="681" y="631" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Yayın sıklığını belirleyin.</text>
<text x="681" y="676" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#091947" text-anchor="start" dominant-baseline="middle">Puan modelini seçin:</text>
<text x="681" y="714" font-family="Arial, sans-serif" font-size="22" fill="#455b7b"><tspan font-weight="600" fill="#091947">Çeksiz Puan</tspan><tspan> – Puan öğrenmenin</tspan></text>
<text x="681" y="743" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">gücüdür. Çeke dönmez.</text>
<text x="681" y="786" font-family="Arial, sans-serif" font-size="22" fill="#455b7b"><tspan font-weight="600" fill="#091947">Serbest Siparişli Puan</tspan><tspan> – Sipariş verilirse</tspan></text>
<text x="681" y="815" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">puan artarak çeke döner.</text>
<text x="681" y="858" font-family="Arial, sans-serif" font-size="22" fill="#455b7b"><tspan font-weight="600" fill="#091947">Sipariş Zorunlu Puan</tspan><tspan> – Puanın çeke</tspan></text>
<text x="681" y="887" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">dönüşmesi için sipariş verilmelidir.</text>
