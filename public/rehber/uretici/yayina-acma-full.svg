<text x="1271" y="690" font-family="Arial, sans-serif" font-size="23" fill="#455b7b"><tspan font-weight="600" fill="#091947">İndirimsiz Puan:</tspan><tspan> Puan öğrenmenin</tspan></text>
<text x="1271" y="722" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">gücüdür.</text>
<text x="1271" y="767" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#091947" text-anchor="start" dominant-baseline="middle">İndirimli Puan:</text>
