<text x="553" y="1332" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#091947" text-anchor="start" dominant-baseline="middle">C-Club Ligi’nden gelişimini takip et</text>
<path d="M60 1430 V1570" stroke="#5e9cff" stroke-width="2"/>
<text x="80" y="1448" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">* Tamamlama puanını ilgili yayın döneminde bir kez kazanırsın; tekrarlar Extra akışına girer.</text>
<text x="80" y="1483" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">İleri sarma kaybı, atladığın süreye göre hesaplanır. C-Club’da gün ve saat sınırı yoktur.</text>
<text x="80" y="1518" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Soruları cevaplamadan ayrılıp yayını yeniden başlatırsan önceki soru hakkın kapanır.</text>
<text x="80" y="1553" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Bu yayın için bekleyen challenge varsa, yayını Gelen Challengelar bölümünden aç.</text>
