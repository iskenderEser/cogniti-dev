<g transform="translate(558,603)"><rect width="50" height="50" rx="16" fill="#e7f2ff"/><g transform="translate(9,9)" fill="none" stroke="#0086ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="14"/><path d="M12 11a4.2 4.2 0 1 1 7 3c-3 2-3 3-3 6M16 25h.01"/></g></g>
<text x="630" y="628" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#091947" text-anchor="start" dominant-baseline="middle">İleri sardın mı?</text>
<text x="450" y="604" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#455b7b" text-anchor="middle" dominant-baseline="middle">Evet</text>
