<g transform="translate(1032,980)"><rect width="50" height="50" rx="16" fill="#e7f2ff"/><g transform="translate(9,9)" fill="none" stroke="#0086ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h5v9H3ZM13 13h5v17h-5ZM23 3h5v27h-5Z"/></g></g>
<text x="1104" y="1005" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#408a13" text-anchor="start" dominant-baseline="middle">Extra puan kazanırsın</text>
<rect x="458" y="1130" width="620" height="84" rx="22" fill="url(#card)" stroke="#8dbaff" stroke-width="1" filter="url(#shadow)"/>
<g transform="translate(481,1147)"><rect width="50" height="50" rx="16" fill="#e7f2ff"/><g transform="translate(9,9)" fill="none" stroke="#0086ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h5v9H3ZM13 13h5v17h-5ZM23 3h5v27h-5Z"/></g></g>
<text x="553" y="1172" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#091947" text-anchor="start" dominant-baseline="middle">Sonucunu ve puanlarını gör</text>
<rect x="458" y="1280" width="620" height="84" rx="22" fill="url(#card)" stroke="#8dbaff" stroke-width="1" filter="url(#shadow)"/>
<g transform="translate(481,1297)"><rect width="50" height="50" rx="16" fill="#e7f2ff"/><g transform="translate(9,9)" fill="none" stroke="#0086ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 26l9-11 7 6L30 5"/></g></g>
<text x="553" y="1322" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#091947" text-anchor="start" dominant-baseline="middle">C-Club Ligi’nden gelişimini takip et</text>
<path d="M60 1420 V1535" stroke="#5e9cff" stroke-width="2"/>
<text x="80" y="1435" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">* İlk tamamlama sayılmaz. Extra puanı bulunan yayınlarda, ikinci uygun tam tekrarda puan kazanırsın.</text>
<text x="80" y="1466" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Aynı yayın için ayda bir kez Extra puan kazanırsın. Yeni ayda tekrar sayımı yeniden başlar.</text>
<text x="80" y="1497" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Yeni yayın döneminde ilk tamamlama Genel Yayın akışına girer; önceki dönemin tekrarları sayılmaz.</text>
<text x="80" y="1528" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Extra’da sorular açılmaz. Gün ve saat sınırı yoktur. İleri sarma kaybı atladığın süreye göre hesaplanır.</text>
</svg>