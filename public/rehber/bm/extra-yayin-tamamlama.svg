<g transform="translate(110,530)"><rect width="50" height="50" rx="16" fill="#e7f2ff"/><g transform="translate(9,9)" fill="none" stroke="#0086ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M27 11A12 12 0 0 0 6 7L2 11M2 4v7h7M5 21a12 12 0 0 0 21 4l4-4M23 21h7v7"/></g></g>
<text x="182" y="544" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#091947" text-anchor="start" dominant-baseline="middle">Yarım kalan yayına</text>
<text x="182" y="578" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#091947" text-anchor="start" dominant-baseline="middle">devam et</text>
