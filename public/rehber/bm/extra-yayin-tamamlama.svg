<g transform="translate(510,813)"><rect width="50" height="50" rx="16" fill="#e7f2ff"/><g transform="translate(9,9)" fill="none" stroke="#0086ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M27 11A12 12 0 0 0 6 7L2 11M2 4v7h7M5 21a12 12 0 0 0 21 4l4-4M23 21h7v7"/></g></g>
<text x="582" y="821" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#091947" text-anchor="start" dominant-baseline="middle">Bu ayki ikinci tam ve</text>
<text x="582" y="858" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#091947" text-anchor="start" dominant-baseline="middle">ileri sarmasız tekrarın mı?*</text>
<text x="405" y="910" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#455b7b" text-anchor="middle" dominant-baseline="middle">Hayır</text>
<text x="1145" y="814" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#455b7b" text-anchor="middle" dominant-baseline="middle">Evet</text>
