<text x="109" y="854" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#cb440c" text-anchor="start" dominant-baseline="middle">TM’ye gönderilmez.</text>
<text x="109" y="885" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#cb440c" text-anchor="start" dominant-baseline="middle">Yeniden değerlendirebilirsiniz.</text>
<rect x="1086" y="757" width="380" height="140" rx="22" fill="url(#warm)" stroke="#ffa17c" stroke-width="1" filter="url(#shadow)"/>
<g transform="translate(1106,777)"><rect width="50" height="50" rx="16" fill="#fff0e7"/><g transform="translate(9,9)" fill="none" stroke="#eb5d21" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l20 20M26 6 6 26"/></g></g>
<text x="1176" y="802" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#cb440c" text-anchor="start" dominant-baseline="middle">Reddedin</text>
<path d="M1110 841 V898" stroke="#ffa17c" stroke-width="2"/>
<text x="1125" y="854" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#cb440c" text-anchor="start" dominant-baseline="middle">TM’ye gönderilmez.</text>
<text x="1125" y="885" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#cb440c" text-anchor="start" dominant-baseline="middle">İletmeden kararınızı değiştirebilirsiniz.</text>
<rect x="518" y="757" width="500" height="84" rx="22" fill="url(#card)" stroke="#8dbaff" stroke-width="1" filter="url(#shadow)"/>
<g transform="translate(541,774)"><rect width="50" height="50" rx="16" fill="#e7f2ff"/><g transform="translate(9,9)" fill="none" stroke="#0086ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l8 8L29 6"/></g></g>
<text x="613" y="799" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#408a13" text-anchor="start" dominant-baseline="middle">Onaylayın</text>
<rect x="428" y="897" width="680" height="150" rx="22" fill="url(#card)" stroke="#8dbaff" stroke-width="1" filter="url(#shadow)"/>
<g transform="translate(451,917)"><rect width="50" height="50" rx="16" fill="#e7f2ff"/><g transform="translate(9,9)" fill="none" stroke="#0086ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 14 30 2 18 30 13 19 2 14ZM13 19 30 2"/></g></g>
<text x="523" y="942" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#091947" text-anchor="start" dominant-baseline="middle">TM Onayına Gönder butonuna basın</text>
<path d="M453 978 V1035" stroke="#8dbaff" stroke-width="2"/>
<text x="468" y="991" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Onay vermek tek başına TM’ye göndermez.</text>
<text x="468" y="1022" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Gönderdikten sonra BM kararınızı değiştiremezsiniz.</text>
<rect x="428" y="1081" width="680" height="84" rx="22" fill="url(#card)" stroke="#8dbaff" stroke-width="1" filter="url(#shadow)"/>
<g transform="translate(451,1098)"><rect width="50" height="50" rx="16" fill="#e7f2ff"/><g transform="translate(9,9)" fill="none" stroke="#0086ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 14 30 2 18 30 13 19 2 14ZM13 19 30 2"/></g></g>
<text x="523" y="1123" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#408a13" text-anchor="start" dominant-baseline="middle">Mutabakat TM onayına iletilir</text>
<rect x="428" y="1221" width="680" height="210" rx="22" fill="url(#card)" stroke="#8dbaff" stroke-width="1" filter="url(#shadow)"/>
<g transform="translate(451,1241)"><rect width="50" height="50" rx="16" fill="#e7f2ff"/><g transform="translate(9,9)" fill="none" stroke="#0086ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 26l9-11 7 6L30 5"/></g></g>
<text x="523" y="1266" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#091947" text-anchor="start" dominant-baseline="middle">TM kararını takip edin</text>
<path d="M453 1302 V1390" stroke="#8dbaff" stroke-width="2"/>
<text x="468" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Onay → Mutabakat onaylanır.</text>
<text x="468" y="1346" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Beklet → TM incelemesinde kalır.</text>
<text x="468" y="1377" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Ret → TM tarafından reddedilir.</text>
</svg>