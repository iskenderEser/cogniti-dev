<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1560" viewBox="0 0 1536 1560" role="img" aria-labelledby="title desc">
<title id="title">Eczanem İndirim Mutabakatı Yol Haritası</title>
<desc id="desc">Bölge Müdürünün mutabakatları inceleme, onaylama, bekletme veya reddetme ve onaylanan kaydı TM onayına iletme akışı.</desc>
<defs>
