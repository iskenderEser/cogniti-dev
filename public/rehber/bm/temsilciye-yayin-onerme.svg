<text x="350" y="676" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#cb440c" text-anchor="middle" dominant-baseline="middle">Engel nedenini görebilirsin.</text>
<text x="223" y="719" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#cb440c" text-anchor="start" dominant-baseline="middle">Seçimini veya tarihlerini</text>
<text x="223" y="747" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#cb440c" text-anchor="start" dominant-baseline="middle">değiştirebilirsin. Hakların dolmuşsa</text>
<text x="223" y="775" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#cb440c" text-anchor="start" dominant-baseline="middle">yenilendiğinde yeniden öneri</text>
<text x="223" y="803" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#cb440c" text-anchor="start" dominant-baseline="middle">gönderebilirsin.</text>
