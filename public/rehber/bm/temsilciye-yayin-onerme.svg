<text x="768" y="84" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#091947" text-anchor="middle" dominant-baseline="middle">Temsilciyi ve yayını seç</text>
<text x="573" y="139" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Aynı anda 1 Temsilci ve her temsilci için</text>
<text x="573" y="164" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">en fazla 3 öneri iletebilirsin.</text>
