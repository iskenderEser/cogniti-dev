<text x="768" y="259" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#091947" text-anchor="middle" dominant-baseline="middle">Başlangıç ve bitiş günlerini belirle</text>
<text x="573" y="299" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Başlangıcı en erken yarın seçebilirsin.</text>
<text x="573" y="327" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">Bitişi, başlangıçtan en az bir gün</text>
<text x="573" y="354" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#455b7b" text-anchor="start" dominant-baseline="middle">sonrası olabilir.</text>
