<text x="768" y="468" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#091947" text-anchor="middle" dominant-baseline="middle">Gönderime uygun mu?</text>
<text x="768" y="511" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#455b7b" text-anchor="middle" dominant-baseline="middle">Temsilcinin kalan haftalık ve senin kalan aylık</text>
<text x="768" y="540" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#455b7b" text-anchor="middle" dominant-baseline="middle">öneri hakkını aşamazsın.</text>
<text x="427" y="465" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#cb440c" text-anchor="middle" dominant-baseline="middle">Hayır</text>
